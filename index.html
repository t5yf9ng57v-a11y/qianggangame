<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>强干矿工</title>
<style>
  html,body{margin:0;padding:0;background:#1a1a1a;height:100%;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  #wrap{position:relative}
  canvas{background:#2b1d12;display:block;border-radius:8px;max-width:100vw;max-height:100vh}
  #tip{position:absolute;bottom:6px;width:100%;text-align:center;color:#888;font:12px sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="700"></canvas>
<div id="tip">点击 / 触屏 放钩 · 强=500 臊=200 干=100 · 抓到弱菜扣300</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=700;
const TYPES=[
 {ch:'强',val:500,r:34,pull:0.9,color:'#ffd54a',w:1},
 {ch:'臊',val:200,r:24,pull:1.6,color:'#e8923a',w:2},
 {ch:'干',val:100,r:16,pull:2.6,color:'#c7d4e8',w:3},
 {ch:'弱菜',val:-300,r:26,pull:1.2,color:'#8a8a8a',w:1.4,bad:true},
];
let items=[],score=0,goal=800,level=1,time=60,state='play';
let ang=-Math.PI/2,dir=1,claw={x:W/2,y:70,len:46,ext:0,mode:'swing',hold:null,tipx:0,tipy:0};
let msg='',msgT=0;
function spawn(){
  items=[];
  const n=6+Math.min(level,6);
  for(let i=0;i<n;i++){
    const r=Math.random();
    const t=TYPES[r<0.25?0:r<0.55?1:r<0.85?2:3];
    items.push({t,x:40+Math.random()*(W-80),y:220+Math.random()*(H-300),got:false,rot:Math.random()*6.28});
  }
}
function reset(){score=0;goal=800;level=1;time=60;state='play';claw.mode='swing';claw.ext=0;claw.hold=null;spawn();}
spawn();
function fire(){
  if(state!=='play')return;
  if(claw.mode==='swing'){claw.mode='out';claw.hold=null;}
  else if(state==='over')reset();
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='over')reset();else fire();});
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(state==='play'){
    time-=dt;
    if(time<=0){time=0;if(score>=goal){level++;goal+=600;time=60;spawn();msg='过关！进入第'+level+'关';msgT=2;}else state='over';}
    if(claw.mode==='swing'){
      ang+=dir*dt*1.4;
      if(ang>-0.35){ang=-0.35;dir=-1}
      if(ang<-Math.PI+0.35){ang=-Math.PI+0.35;dir=1}
    }else if(claw.mode==='out'){
      claw.ext+=dt*300;
      const tx=claw.x+Math.cos(ang)*claw.ext,ty=claw.y-Math.sin(ang)*claw.ext;
      let hit=null;
      for(const it of items){if(it.got)continue;
        const dx=tx-it.x,dy=ty-it.y;
        if(dx*dx+dy*dy<(it.t.r+10)*(it.t.r+10)){hit=it;break}}
      if(hit){hit.got=true;claw.hold=hit;claw.mode='in';score+=hit.t.val;
        msg=hit.t.val>0?'+'+hit.t.val+' '+hit.t.ch:hit.t.val+' 弱菜！';msgT=1.2;}
      if(tx<10||tx>W-10||ty>H-10){claw.mode='in';}
    }else if(claw.mode==='in'){
      const sp=(claw.hold?110*claw.hold.t.pull:260);
      claw.ext-=dt*sp;
      if(claw.ext<=46){claw.ext=46;claw.mode='swing';claw.hold=null;}
    }
    if(msgT>0)msgT-=dt;
  }
  draw();
  requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 地面天空
  ctx.fillStyle='#3a281a';ctx.fillRect(0,0,W,150);
  ctx.fillStyle='#241608';ctx.fillRect(0,150,W,H-150);
  // 矿工
  ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.arc(W/2,52,22,0,6.28);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
  ctx.fillText('臊',W/2,60);
  // 支架
  ctx.strokeStyle='#666';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(W/2,74);ctx.lineTo(W/2,claw.y);ctx.stroke();
  // 钩子
  const tx=claw.x+Math.cos(ang)*claw.ext,ty=claw.y-Math.sin(ang)*claw.ext;
  claw.tipx=tx;claw.tipy=ty;
  ctx.strokeStyle='#aaa';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(claw.x,claw.y);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.beginPath();ctx.arc(tx,ty,8,ang-2.6,ang+2.6);ctx.stroke();
  // 抓到的字
  if(claw.hold){
    ctx.font='bold '+claw.hold.t.r*1.6+'px sans-serif';
    ctx.fillStyle=claw.hold.t.color;
    ctx.fillText(claw.hold.t.ch==='弱菜'?'弱':claw.hold.t.ch,tx,ty+claw.hold.t.r*0.6);
  }
  // 字块
  for(const it of items){
    if(it.got)continue;
    ctx.font='bold '+(it.t.r*1.8)+'px sans-serif';
    ctx.fillStyle=it.t.color;
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(it.rot+performance.now()/900)*0.15);
    ctx.fillText(it.t.bad?'弱':it.t.ch,0,it.t.r*0.6);
    if(it.t.bad){ctx.font='bold '+(it.t.r*0.9)+'px sans-serif';ctx.fillText('菜',it.t.r*0.9,it.t.r*1.4);}
    ctx.restore();
  }
  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
  ctx.fillText('得分 '+score,14,30);
  ctx.fillText('目标 '+goal,14,60);
  ctx.textAlign='right';
  ctx.fillText('第'+level+'关',W-14,30);
  ctx.fillText('时间 '+Math.ceil(time),W-14,60);
  ctx.textAlign='center';
  if(msgT>0){ctx.fillStyle='#ffd54a';ctx.font='bold 30px sans-serif';ctx.fillText(msg,W/2,130);}
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f2c94c';ctx.font='bold 44px sans-serif';
    ctx.fillText('臊不动了…',W/2,H/2-40);
    ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';
    ctx.fillText('最终得分 '+score+' · 第'+level+'关',W/2,H/2+6);
    ctx.fillText('点击屏幕重新开始',W/2,H/2+50);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
